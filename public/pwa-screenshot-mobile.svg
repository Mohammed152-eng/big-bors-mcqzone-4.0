  <rect x="350" y="1320" width="160" height="42" rx="21" fill="rgba(244,240,107,0.15)" stroke="rgba(244,240,107,0.4)" stroke-width="1.5"/>
  <text x="375" y="1347" fill="#1A1A1A" font-size="22" font-weight="700">⭐ Trending</text>
  
