  <text x="140" y="1245" fill="#1A1A1A" font-size="38" font-weight="900">0625 W25 Paper 11</text>
  <text x="140" y="1285" fill="rgba(26,26,26,0.6)" font-size="26" font-weight="600">40 Questions · 75 min · Theory</text>
  
