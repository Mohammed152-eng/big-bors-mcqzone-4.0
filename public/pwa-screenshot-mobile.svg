  <text x="140" y="1810" fill="#FDFBF7" font-size="32" font-weight="900">📥 Offline Library</text>
  <text x="140" y="1850" fill="rgba(253,251,247,0.7)" font-size="24" font-weight="600">Download papers for offline practice</text>
  
  <!-- Bottom navigation (mobile style) -->
  <rect x="60" y="2340" width="1050" height="110" fill="#FDFBF7" stroke-width="0"/>
  <line x1="60" y1="2340" x2="1110" y2="2340" stroke="rgba(26,26,26,0.05)" stroke-width="2"/>
  
  <!-- Nav items -->
  <!-- Practice (active) -->
  <g>
    <rect x="180" y="2365" width="60" height="60" rx="16" fill="rgba(209,221,194,0.2)"/>
    <circle cx="210" cy="2385" r="8" fill="#D1DDC2"/>
    <rect x="208" y="2395" width="4" height="12" fill="#D1DDC2"/>
    <text x="210" y="2430" fill="#1A1A1A" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">PRACTICE</text>
  </g>
  
  <!-- Topicals -->
  <g opacity="0.35">
    <rect x="490" y="2365" width="60" height="60" rx="16"/>
    <rect x="510" y="2375" width="20" height="20" rx="4" fill="#1A1A1A"/>
    <text x="520" y="2430" fill="#1A1A1A" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">TOPICALS</text>
  </g>
  
  <!-- Ranked -->
  <g opacity="0.35">
    <rect x="800" y="2365" width="60" height="60" rx="16"/>
    <polygon points="830,2380 820,2405 840,2405" fill="#1A1A1A"/>
    <text x="830" y="2430" fill="#1A1A1A" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">RANKED</text>
