  <text x="140" y="1520" fill="#1A1A1A" font-size="38" font-weight="900">0625 W24 Paper 12</text>
  <text x="140" y="1560" fill="rgba(26,26,26,0.6)" font-size="26" font-weight="600">40 Questions · 75 min · Theory</text>
  
  <!-- Stats badges -->
  <rect x="140" y="1595" width="190" height="42" rx="21" fill="rgba(209,221,194,0.15)" stroke="rgba(209,221,194,0.3)" stroke-width="1.5"/>
  <text x="165" y="1622" fill="#1A1A1A" font-size="22" font-weight="700">🎯 189 attempts</text>
  
  <!-- Load button -->
  <rect x="140" y="1653" width="900" height="42" rx="21" fill="#D1DDC2" stroke="rgba(26,26,26,0.15)" stroke-width="2"/>
  <text x="520" y="1680" fill="#1A1A1A" font-size="22" font-weight="800" letter-spacing="1.8">LOAD PAPER</text>
  
  <!-- Offline library banner -->
