<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Define fonts -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    
    <!-- Shadow filters -->
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1600" height="900" fill="#F4EFE6"/>
  
  <!-- Main browser window -->
  <rect x="80" y="60" width="1440" height="780" rx="16" fill="#FDFBF7" filter="url(#cardShadow)" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Browser chrome -->
  <rect x="80" y="60" width="1440" height="56" rx="16" fill="#E8E8E8"/>
  <rect x="80" y="98" width="1440" height="18" fill="#E8E8E8"/>
  <circle cx="110" cy="82" r="8" fill="#FF5F56"/>
  <circle cx="140" cy="82" r="8" fill="#FFBD2E"/>
  <circle cx="170" cy="82" r="8" fill="#27C93F"/>
  
  <!-- URL bar -->
  <rect x="240" y="70" width="1120" height="28" rx="14" fill="#FFFFFF"/>
  <text x="260" y="89" fill="rgba(26,26,26,0.5)" font-size="16" font-weight="600">quickmark.co/app/practice</text>
  
  <!-- App header -->
  <rect x="140" y="156" width="1320" height="68" rx="34" fill="#D1DDC2"/>
  <text x="180" y="197" fill="#1A1A1A" font-size="32" font-weight="800" letter-spacing="1.5">QuickMark</text>
  
  <!-- Desktop tab navigation -->
  <rect x="640" y="166" width="480" height="48" rx="24" fill="rgba(255,255,255,0.6)" stroke="rgba(26,26,26,0.05)" stroke-width="1.5"/>
  
  <!-- Practice tab (active) -->
  <rect x="654" y="176" width="140" height="28" rx="14" fill="rgba(209,221,194,0.15)" stroke="rgba(209,221,194,0.3)" stroke-width="1.5"/>
  <text x="694" y="195" fill="#1A1A1A" font-size="14" font-weight="800" letter-spacing="1.2">PRACTICE</text>
  
  <!-- Topicals tab -->
  <text x="834" y="195" fill="rgba(26,26,26,0.35)" font-size="14" font-weight="800" letter-spacing="1.2">TOPICALS</text>
  
  <!-- Ranked tab -->
  <text x="1000" y="195" fill="rgba(26,26,26,0.35)" font-size="14" font-weight="800" letter-spacing="1.2">RANKED</text>
  
  <!-- User menu icon -->
  <circle cx="1400" cy="190" r="20" fill="rgba(26,26,26,0.08)"/>
  <text x="1400" y="198" fill="#1A1A1A" font-size="18" font-weight="700" text-anchor="middle">U</text>
  
  <!-- Main content area -->
  <g>
    <!-- Continue card -->
    <rect x="140" y="264" width="1320" height="110" rx="24" fill="rgba(209,221,194,0.1)" stroke="rgba(209,221,194,0.3)" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Icon -->
    <rect x="170" y="290" width="44" height="44" rx="12" fill="rgba(209,221,194,0.2)"/>
    <circle cx="192" cy="312" r="12" stroke="#D1DDC2" stroke-width="2.5" fill="none"/>
    <path d="M 186 306 L 186 312 L 192 316" stroke="#D1DDC2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Text -->
    <text x="240" y="308" fill="#1A1A1A" font-size="18" font-weight="900" letter-spacing="0.3">Continue where you left off</text>
    <text x="240" y="330" fill="rgba(26,26,26,0.5)" font-size="15" font-weight="700">0625 W25 Paper 11 · 8 answered · 44:23 left</text>
    
    <!-- Resume button -->
    <rect x="1180" y="294" width="260" height="36" rx="18" fill="#1A1A1A" stroke="rgba(26,26,26,0.15)" stroke-width="1.5"/>
    <polygon points="1200,308 1200,316 1207,312" fill="#FDFBF7"/>
    <text x="1220" y="317" fill="#FDFBF7" font-size="15" font-weight="800" letter-spacing="1.2">RESUME PAPER</text>
  </g>
  
  <!-- Selection section -->
  <text x="140" y="425" fill="rgba(26,26,26,0.3)" font-size="16" font-weight="900" letter-spacing="3.2">SELECTION</text>
  <line x1="280" y1="420" x2="1460" y2="420" stroke="rgba(26,26,26,0.05)" stroke-width="1"/>
  
  <!-- Dropdowns row -->
  <g>
    <!-- Board -->
    <g>
      <text x="140" y="470" fill="rgba(26,26,26,0.6)" font-size="14" font-weight="700" letter-spacing="1.8">BOARD</text>
      <rect x="140" y="485" width="420" height="56" rx="16" fill="#FFFFFF" stroke="rgba(26,26,26,0.1)" stroke-width="2"/>
      <text x="170" y="518" fill="#1A1A1A" font-size="20" font-weight="700">IGCSE / O-Level</text>
      <path d="M 530 507 L 540 518 L 550 507" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Subject -->
    <g>
      <text x="600" y="470" fill="rgba(26,26,26,0.6)" font-size="14" font-weight="700" letter-spacing="1.8">SUBJECT</text>
      <rect x="600" y="485" width="420" height="56" rx="16" fill="#FFFFFF" stroke="rgba(26,26,26,0.1)" stroke-width="2"/>
      <text x="630" y="518" fill="#1A1A1A" font-size="20" font-weight="700">Physics (0625)</text>
      <path d="M 990 507 L 1000 518 L 1010 507" stroke="#1A1A1A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
    <!-- Offline Library button -->
    <rect x="1060" y="485" width="400" height="56" rx="16" fill="rgba(26,26,26,0.95)" stroke="rgba(26,26,26,0.15)" stroke-width="2"/>
    <text x="1100" y="518" fill="#FDFBF7" font-size="18" font-weight="800" letter-spacing="1.5">📥 OFFLINE LIBRARY</text>
  </g>
  
  <!-- Papers section -->
  <text x="140" y="610" fill="rgba(26,26,26,0.3)" font-size="16" font-weight="900" letter-spacing="3.2">AVAILABLE PAPERS</text>
  <line x1="370" y1="605" x2="1460" y2="605" stroke="rgba(26,26,26,0.05)" stroke-width="1"/>
  
  <!-- Paper cards grid -->
  <!-- Card 1 -->
  <rect x="140" y="635" width="640" height="170" rx="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="175" y="672" fill="#1A1A1A" font-size="28" font-weight="900">0625 W25 Paper 11</text>
  <text x="175" y="702" fill="rgba(26,26,26,0.6)" font-size="18" font-weight="600">40 Questions · 75 min · Theory</text>
  
  <!-- Stats -->
  <rect x="175" y="725" width="140" height="28" rx="14" fill="rgba(209,221,194,0.15)" stroke="rgba(209,221,194,0.3)" stroke-width="1.2"/>
  <text x="195" y="745" fill="#1A1A1A" font-size="14" font-weight="700">🎯 214 attempts</text>
  
  <rect x="330" y="725" width="110" height="28" rx="14" fill="rgba(244,240,107,0.15)" stroke="rgba(244,240,107,0.4)" stroke-width="1.2"/>
  <text x="350" y="745" fill="#1A1A1A" font-size="14" font-weight="700">⭐ Trending</text>
  
  <!-- Load button -->
  <rect x="175" y="765" width="575" height="32" rx="16" fill="#D1DDC2" stroke="rgba(26,26,26,0.15)" stroke-width="1.5"/>
  <text x="415" y="787" fill="#1A1A1A" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="middle">LOAD PAPER</text>
  
  <!-- Card 2 -->
  <rect x="820" y="635" width="640" height="170" rx="24" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2" filter="url(#cardShadow)"/>
  <text x="855" y="672" fill="#1A1A1A" font-size="28" font-weight="900">0625 W24 Paper 12</text>
  <text x="855" y="702" fill="rgba(26,26,26,0.6)" font-size="18" font-weight="600">40 Questions · 75 min · Theory</text>
  
  <!-- Stats -->
  <rect x="855" y="725" width="140" height="28" rx="14" fill="rgba(209,221,194,0.15)" stroke="rgba(209,221,194,0.3)" stroke-width="1.2"/>
  <text x="875" y="745" fill="#1A1A1A" font-size="14" font-weight="700">🎯 189 attempts</text>
  
  <!-- Load button -->
  <rect x="855" y="765" width="575" height="32" rx="16" fill="#D1DDC2" stroke="rgba(26,26,26,0.15)" stroke-width="1.5"/>
  <text x="1095" y="787" fill="#1A1A1A" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="middle">LOAD PAPER</text>
</svg>
